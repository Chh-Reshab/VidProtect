# Render blueprint: one web service runs the API and serves the built site.
# Deploy: push to GitHub, then Render dashboard -> New -> Blueprint -> pick the repo.
# After the first deploy, open the service -> Environment and fill in the two values
# marked "sync: false" (ADMIN_PASSWORD and VP_MASTER_KEY). See README "Deploying to Render".
services:
  - type: web
    name: vidprotect
    runtime: node
    plan: free # free = data and uploads reset on every restart/redeploy; see the disk block below
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD # at least 12 characters; becomes the admin login password
        sync: false
      - key: VP_MASTER_KEY # 64 hex characters, see README; keep a copy somewhere safe
        sync: false

    # To KEEP data and videos across restarts you need a paid plan (e.g. starter) with a disk.
    # Then change `plan: free` to `plan: starter`, uncomment this block and the two env vars:
    # disk:
    #   name: vidprotect-data
    #   mountPath: /var/data
    #   sizeGB: 5
    # (add to envVars)
    #   - key: VP_DATA_DIR
    #     value: /var/data/db
    #   - key: VP_UPLOAD_DIR
    #     value: /var/data/uploads
