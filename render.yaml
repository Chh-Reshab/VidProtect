# Render blueprint: one web service runs the API and serves the built site.
# Deploy: push to GitHub, then Render dashboard -> New -> Blueprint -> pick the repo.
# After the first deploy, open the service -> Environment and fill in the two values
# marked "sync: false" (ADMIN_EMAIL, ADMIN_PASSWORD, VP_MASTER_KEY and MONGODB_URI). See README "Deploying to Render".
services:
  - type: web
    name: vidprotect
    runtime: node
    plan: free # the disk is temporary, but all data AND videos live in MongoDB Atlas (free tier), so nothing is lost
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL # email address of the admin account, created on first start
        sync: false
      - key: ADMIN_PASSWORD # at least 12 characters; becomes the admin login password
        sync: false
      - key: VP_MASTER_KEY # 64 hex characters, see README; keep a copy somewhere safe
        sync: false
      - key: MONGODB_URI # from MongoDB Atlas (free M0): mongodb+srv://USER:PASSWORD@cluster.mongodb.net/vidprotect
        sync: false
      - key: GMAIL_CLIENT_ID # email verification through your Gmail (free); see README. Leave all mail variables unset to skip verification
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM # your Gmail address (or a sender verified in Brevo if you use BREVO_API_KEY instead)
        sync: false
      - key: RAZORPAY_KEY_ID # online payments: rzp_test_... (test mode, free) or rzp_live_... Leave unset to use the built-in test checkout
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET # the secret you type when adding the webhook in Razorpay
        sync: false
      - key: S3_BUCKET # Amazon S3 bucket that holds the encrypted videos and thumbnails
        sync: false
      - key: AWS_REGION # region of the bucket, e.g. ap-south-1
        sync: false
      - key: AWS_ACCESS_KEY_ID # of an IAM user that can only use this bucket
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

    # Data is stored in MongoDB and encrypted videos in Amazon S3 (leave S3_BUCKET unset to keep videos
    # in MongoDB GridFS instead), so no Render disk is needed.
    # Without MONGODB_URI the app falls back to files on the (temporary) disk and warns in the logs.
